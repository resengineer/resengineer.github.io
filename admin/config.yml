backend:
  name: gitea
  repo: dmitry/resengineer.org
  app_id: 50e9c4c3-2f0b-48b8-a131-bcbc3c4d4407
  api_root: https://git.lab.resengineer.org/api/v1
  base_url: https://git.lab.resengineer.org
  auth_endpoint: https://git.lab.resengineer.org/login/oauth/authorize
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "highlights"
    label: "Highlights"
    label_singular: "Highlight"
    folder: "content/highlights"
    create: true
    slug: "{{year}}-{{slug}}"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Year"
        name: "year"
        widget: "number"
        value_type: "int"

      - label: "Order"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 100
        hint: "Smaller number appears earlier within the same year"

      - label: "Show on Home Page"
        name: "featured"
        widget: "boolean"
        default: true

      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        fields:
          - label: "Image"
            name: "src"
            widget: "image"

          - label: "Alt text"
            name: "alt"
            widget: "string"
            required: false

          - label: "Caption"
            name: "caption"
            widget: "string"
            required: false

      - label: "Short Description"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Short text shown in the highlight or archive"

      - label: "Read More URL"
        name: "page_url"
        widget: "string"
        required: false
        hint: "Optional. Example: /pages/heriot-watt-university/"

      - label: "Read More Label"
        name: "page_label"
        widget: "string"
        required: false
        default: "Read more →"

      - label: "External Links"
        name: "links"
        widget: "list"
        required: false
        fields:
          - label: "Text"
            name: "label"
            widget: "string"

          - label: "URL"
            name: "url"
            widget: "string"

      - label: "Tags"
        name: "tags"
        widget: "hidden"
        default: "highlights"

      - label: "Generate Separate Page"
        name: "permalink"
        widget: "hidden"
        default: false